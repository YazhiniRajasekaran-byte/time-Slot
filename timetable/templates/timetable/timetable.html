<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Class Timetable</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f9f9f9;
        }
        h2 {
            color: #333;
            text-align: center;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background-color: #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        th, td {
            padding: 12px 15px;
            border: 1px solid #ddd;
            text-align: center;
        }
        th {
            background-color: #007bff;
            color: white;
        }
        tr:nth-child(even) {
            background-color: #f2f2f2;
        }
        .no-records {
            text-align: center;
            padding: 20px;
            color: #666;
            font-style: italic;
        }
    </style>
</head>
<body>

    <h2>Class Timetable</h2>

    <table>
        <thead>
            <tr>
                <th>Day</th>
                <th>Time Slot</th>
                <th>Subject</th>
                <th>Faculty Name</th>
                <th>Classroom</th>
            </tr>
        </thead>
        <tbody>
            {% for slot in slots %}
            <tr>
                <td>{{ slot.day }}</td>
                <td>{{ slot.start_time }} - {{ slot.end_time }}</td>
                <td>{{ slot.subject_name }}</td>
                <td>{{ slot.faculty_name }}</td>
                <td>{{ slot.classroom }}</td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="5" class="no-records">No timetable records are currently available.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

</body>
</html>
